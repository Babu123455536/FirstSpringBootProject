<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Student Management System</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER */

        .header {
            flex-shrink: 0;
        }

        /* LOGIN AREA */

        .login-main {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 1100px;
            
            min-height:80px;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.12);
        }

        .login-card h1 {
            text-align: center;

            margin: 0 0 8px;

            color: #222;
        }

        .login-card .welcome {
            text-align: center;

            color: #666;

            margin: 0 0 25px;
        }

        /* FORM */

        #loginForm {
            width: 100%;
        }

        .form-row {
            display: flex;

            align-items: center;

            margin-bottom: 18px;
        }

        .form-row label {
            width: 100px;

            font-weight: bold;

            color: #374151;
        }

        .form-row input {
            flex: 1;

            padding: 11px;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            font-size: 15px;
        }

        .form-row input:focus {
            outline: none;

            border-color: #2563eb;
        }

        /* LOGIN BUTTON */

        .login-btn {
            display: block;

            width: 100%;

            padding: 12px;

            margin-top: 8px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        /* MESSAGE */

        #loginMessage {
            text-align: center;

            margin-top: 15px;

            color: #dc2626;

            font-weight: bold;
        }

        /* FOOTER */

        .footer {
            flex-shrink: 0;

            margin-top: 0;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .login-main {
                padding: 20px 15px;
            }

            .login-card {
                padding: 25px 20px;
            }

            .form-row {
                display: block;
            }

            .form-row label {
                display: block;

                width: 100%;

                margin-bottom: 7px;
            }

            .form-row input {
                width: 100%;
            }
        }
        /* LOGIN FORM - ALL IN ONE ROW */

#loginForm {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 12px !important;
    width: 100% !important;
}

#loginForm .form-row {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    margin: 0 !important;
    flex: 1 !important;
}

#loginForm .form-row label {
    width: auto !important;
    margin: 0 !important;
    white-space: nowrap !important;
    font-size: 15px !important;
}

#loginForm .form-row input {
    width: 160px !important;
    flex: 1 !important;
    padding: 10px !important;
    margin: 0 !important;
}

#loginForm .login-btn {
    width: 100px !important;
    margin: 0 !important;
    padding: 10px 15px !important;
    flex-shrink: 0 !important;
}
    </style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="header-container">

        <h2>Student Management System</h2>

    </div>

</header>


<!-- LOGIN -->

<main class="login-main">

    <div class="login-card">

        <h1>Admin Login</h1>

        <p class="welcome">
            Login to access the Student Management System
        </p>


        <form id="loginForm">


            <!-- USERNAME -->

            <div class="form-row">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-row">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn">

                Login

            </button>


            <p id="loginMessage"></p>

        </form>

    </div>

</main>


<!-- FOOTER -->

<footer class="footer">

    <p>
        © 2026 Student Management System |
        All Rights Reserved
    </p>

</footer>


<!-- JAVASCRIPT -->

<script>

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value
        .trim();

    const message =
        document.getElementById("loginMessage");

    message.textContent = "Logging in...";


    fetch("/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            username: username,
            password: password
        })

    })

    .then(function(response) {

        return response.text();

    })

    .then(function(result) {

        if (result === "Login Successful") {

            sessionStorage.setItem(
                "loggedIn",
                "true"
            );

            sessionStorage.setItem(
                "username",
                username
            );

            window.location.href =
                "index.html";

        } else {

            message.textContent =
                "Invalid username or password.";

        }

    })

    .catch(function(error) {

        console.error(
            "Login Error:",
            error
        );

        message.textContent =
            "Unable to connect to server.";

    });

});

</script>


</body>

</html>
